<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="eggRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#eggBg)"/>

  <!-- Molecular grid background -->
  <g stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3">
    <line x1="20" y1="30" x2="380" y2="30"/>
    <line x1="20" y1="90" x2="380" y2="90"/>
    <line x1="20" y1="150" x2="380" y2="150"/>
  </g>

  <!-- Watermark PDB ID -->
  <text x="380" y="145" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="76" font-weight="900" fill="#f59e0b" opacity="0.12">1OVA</text>

  <!-- Protein Serpin Folding Ribbon -->
  <path d="M 40,110 C 80,40 140,40 180,100 C 220,160 270,140 310,70 C 330,35 360,50 370,90" 
        stroke="url(#eggRibbon)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 70,140 C 120,150 170,120 200,60 C 230,10 290,30 330,90" 
        stroke="url(#tealAccent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 2" fill="none" opacity="0.6"/>

  <!-- Atom Nodes -->
  <circle cx="180" cy="100" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="310" cy="70" r="8" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <circle cx="200" cy="60" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>

  <!-- Badge Pill -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="14" y="19" font-size="14">🥚</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#92400e">Putih Telur</text>
  </g>
</svg>
