<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="caseinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="60%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="caseinRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#caseinBg)"/>

  <text x="380" y="145" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="76" font-weight="900" fill="#9333ea" opacity="0.12">1JFP</text>

  <!-- Micellar flexible loops -->
  <path d="M 50,130 C 110,60 160,160 220,70 C 280,-10 320,130 360,80" 
        stroke="url(#caseinRibbon)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="220" cy="70" r="9" fill="#7e22ce" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="160" cy="120" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="300" cy="80" r="7" fill="#6b21a8" stroke="#ffffff" stroke-width="2"/>

  <!-- Micelle Calcium Phosphate Cluster dots -->
  <circle cx="210" cy="60" r="3" fill="#fbbf24"/>
  <circle cx="228" cy="78" r="2.5" fill="#fbbf24"/>

  <g transform="translate(20, 20)">
    <rect width="145" height="28" rx="14" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
    <text x="14" y="19" font-size="14">🧀</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#6b21a8">Kasein Susu</text>
  </g>
</svg>
