<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="genBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="genRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#genBg)"/>

  <g stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3">
    <line x1="20" y1="30" x2="380" y2="30"/>
    <line x1="20" y1="90" x2="380" y2="90"/>
    <line x1="20" y1="150" x2="380" y2="150"/>
  </g>

  <!-- Stylized folding ribbon -->
  <path d="M 40,80 C 100,140 160,40 220,110 C 280,180 330,50 370,100" 
        stroke="url(#genRibbon)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="220" cy="110" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="150" cy="60" r="7" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
  <circle cx="310" cy="80" r="7" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>

  <g transform="translate(20, 20)">
    <rect width="145" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="19" font-size="14">🔬</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#334155">Molekul Protein</text>
  </g>
</svg>
