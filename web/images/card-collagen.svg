<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="colBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="60%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="colRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="colRibbon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#colBg)"/>

  <text x="380" y="145" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="76" font-weight="900" fill="#0891b2" opacity="0.12">1CAG</text>

  <!-- Triple Helix Fibril Rope -->
  <path d="M 30,70 Q 120,130 200,80 T 370,90" stroke="url(#colRibbon1)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 30,90 Q 120,50 200,100 T 370,70" stroke="url(#colRibbon2)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 30,110 Q 120,120 200,70 T 370,110" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 2" fill="none" opacity="0.75"/>

  <circle cx="200" cy="80" r="7" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
  <circle cx="280" cy="95" r="6" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>

  <g transform="translate(20, 20)">
    <rect width="145" height="28" rx="14" fill="#ffffff" stroke="#67e8f9" stroke-width="1.2"/>
    <text x="14" y="19" font-size="14">🦴</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#155e75">Gelatin &amp; Tulang</text>
  </g>
