<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgOrb1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="bgOrb2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Glowing Orbs -->
  <circle cx="260" cy="200" r="160" fill="url(#bgOrb1)"/>
  <circle cx="340" cy="160" r="120" fill="url(#bgOrb2)"/>

  <!-- Tech Grid Coordinate Background -->
  <g stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.45">
    <line x1="60" y1="60" x2="460" y2="60"/>
    <line x1="60" y1="140" x2="460" y2="140"/>
    <line x1="60" y1="220" x2="460" y2="220"/>
    <line x1="60" y1="300" x2="460" y2="300"/>
    <line x1="60" y1="380" x2="460" y2="380"/>

    <line x1="100" y1="40" x2="100" y2="390"/>
    <line x1="200" y1="40" x2="200" y2="390"/>
    <line x1="300" y1="40" x2="300" y2="390"/>
    <line x1="400" y1="40" x2="400" y2="390"/>
  </g>

  <!-- Orbit Rings & Coordinate Markers -->
  <ellipse cx="260" cy="210" rx="190" ry="110" stroke="#0d9488" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3" transform="rotate(-15 260 210)"/>
  <ellipse cx="260" cy="210" rx="140" ry="80" stroke="#6366f1" stroke-width="1" stroke-dasharray="6 8" opacity="0.3" transform="rotate(25 260 210)"/>

  <!-- Hydrogen Bonds & Crosslinks -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7">
    <line x1="160" y1="140" x2="220" y2="190"/>
    <line x1="250" y1="120" x2="320" y2="170"/>
    <line x1="210" y1="270" x2="280" y2="230"/>
    <line x1="320" y1="260" x2="370" y2="200"/>
    <line x1="170" y1="220" x2="240" y2="270"/>
  </g>

  <!-- Main Protein Ribbon 1 (Alpha-Helix Loop Complex) -->
  <path d="M 90,260 C 130,170 170,110 230,130 C 290,150 250,250 200,240 C 150,230 180,310 240,320 C 310,330 360,260 350,190 C 340,120 410,130 440,210" 
        stroke="url(#ribbon1)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
  <path d="M 90,260 C 130,170 170,110 230,130 C 290,150 250,250 200,240 C 150,230 180,310 240,320 C 310,330 360,260 350,190 C 340,120 410,130 440,210" 
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>

  <!-- Beta Pleated Sheet Segment (Arrow Ribbon Motif) -->
  <g opacity="0.9">
    <path d="M 170,170 L 290,170 L 320,180 L 290,190 L 170,190 Z" fill="url(#sheetGrad)"/>
    <path d="M 180,205 L 300,205 L 330,215 L 300,225 L 180,225 Z" fill="url(#sheetGrad)" opacity="0.8"/>
  </g>

  <!-- Secondary Ribbon Loop (Intertwined) -->
  <path d="M 140,120 C 200,80 270,110 290,170 C 310,230 250,300 320,330 C 370,350 420,310 420,250" 
        stroke="url(#ribbon2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>

  <!-- Amino Acid Residue Nodes (Ball-and-stick with elements) -->
  <!-- Leu Node -->
  <g transform="translate(140, 130)">
    <circle cx="0" cy="0" r="16" fill="#0d9488" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="14" fill="#14b8a6"/>
    <circle cx="-4" cy="-4" r="5" fill="#5eead4" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#ffffff">LEU</text>
  </g>

  <!-- Lys Node -->
  <g transform="translate(230, 130)">
    <circle cx="0" cy="0" r="17" fill="#2563eb" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="15" fill="#3b82f6"/>
    <circle cx="-4" cy="-4" r="5" fill="#93c5fd" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#ffffff">LYS</text>
  </g>

  <!-- Val Node -->
  <g transform="translate(345, 190)">
    <circle cx="0" cy="0" r="16" fill="#0d9488" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="14" fill="#0f766e"/>
    <circle cx="-4" cy="-4" r="4" fill="#2dd4bf" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#ffffff">VAL</text>
  </g>

  <!-- Met Node -->
  <g transform="translate(240, 320)">
    <circle cx="0" cy="0" r="16" fill="#d97706" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
    <circle cx="-4" cy="-4" r="4" fill="#fde68a" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#ffffff">MET</text>
  </g>

  <!-- Phe Node -->
  <g transform="translate(320, 330)">
    <circle cx="0" cy="0" r="15" fill="#7c3aed" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="13" fill="#8b5cf6"/>
    <circle cx="-4" cy="-4" r="4" fill="#c4b5fd" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#ffffff">PHE</text>
  </g>

  <!-- Gln Node -->
  <g transform="translate(195, 240)">
    <circle cx="0" cy="0" r="14" fill="#059669" filter="url(#shadowBox)"/>
    <circle cx="0" cy="0" r="12" fill="#10b981"/>
    <circle cx="-3" cy="-3" r="3" fill="#6ee7b7" opacity="0.7"/>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="8" font-weight="700" fill="#ffffff">GLN</text>
  </g>

  <!-- Terminal Tags (N-term and C-term) -->
  <g transform="translate(80, 275)">
    <rect x="-14" y="-10" width="46" height="20" rx="10" fill="#0f172a" opacity="0.85"/>
    <text x="9" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">N-Term</text>
  </g>
  <g transform="translate(435, 230)">
    <rect x="-14" y="-10" width="46" height="20" rx="10" fill="#0f172a" opacity="0.85"/>
    <text x="9" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">C-Term</text>
  </g>

  <!-- Floating Scientific Badges -->
  <!-- Badge 1: 3D Crystal PDB -->
  <g transform="translate(70, 75)" filter="url(#shadowBox)">
    <rect width="135" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="19" r="11" fill="#ccfbf1"/>
    <text x="20" y="23" text-anchor="middle" font-size="12">🧬</text>
    <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Resolusi Kristal</text>
    <text x="38" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#0d9488">1.45 Å (PDB)</text>
  </g>

  <!-- Badge 2: BCAA Complete -->
  <g transform="translate(320, 60)" filter="url(#shadowBox)">
    <rect width="145" height="38" rx="19" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="20" cy="19" r="11" fill="#dbeafe"/>
    <text x="20" y="23" text-anchor="middle" font-size="12">✨</text>
    <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Skor DIAAS</text>
    <text x="38" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#2563eb">Tinggi (98%)</text>
  </g>

  <!-- Badge 3: 3Dmol Interactive Ready -->
  <g transform="translate(280, 360)" filter="url(#shadowBox)">
    <rect width="160" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
    <circle cx="20" cy="19" r="11" fill="#1e293b"/>
    <text x="20" y="23" text-anchor="middle" font-size="12">🔬</text>
    <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#f8fafc">3Dmol.js Engine</text>
    <text x="38" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Interactive WebGL</text>
  </g>
</svg>
