<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="logoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon on Left (40x40 at x=4, y=4) -->
  <g transform="translate(2, 2)">
    <rect width="44" height="44" rx="11" fill="#f0fdfa"/>
    <rect width="43" height="43" x="0.5" y="0.5" rx="10.5" stroke="url(#logoGrad1)" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Bond Lines -->
    <line x1="14" y1="13" x2="30" y2="16" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <line x1="12" y1="22" x2="32" y2="22" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <line x1="14" y1="31" x2="30" y2="28" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

    <!-- Strands -->
    <path d="M 14,9 C 23,13 32,16 31,23 C 30,29 13,29 13,35 C 13,37 15,38 18,38" 
          stroke="url(#logoGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 30,7 C 21,11 12,16 13,22 C 15,27 31,28 29,35 C 28,37 22,38 20,38" 
          stroke="url(#logoGrad2)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Nodes -->
    <circle cx="14" cy="9" r="2.8" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="31" cy="16" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="13" cy="22" r="3" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="31" cy="22" r="2.6" fill="#6366f1" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="13" cy="32" r="2.8" fill="#818cf8" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="29" cy="35" r="3" fill="#4f46e5" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="1.8" fill="#f59e0b"/>
  </g>

  <!-- Typography -->
  <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="url(#logoTextGrad)" letter-spacing="-0.02em">
    Protein<tspan fill="#0d9488">Pangan</tspan>
  </text>
  <text x="56.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.08em">
    BIO-NUTRISI &amp; STRUKTUR 3D
  </text>
</svg>
