<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wheyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="60%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="wheyRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#wheyBg)"/>

  <g stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.25">
    <line x1="20" y1="30" x2="380" y2="30"/>
    <line x1="20" y1="90" x2="380" y2="90"/>
    <line x1="20" y1="150" x2="380" y2="150"/>
  </g>

  <text x="380" y="145" text-anchor="end" font-family="'JetBrains Mono', monospace, sans-serif" font-size="76" font-weight="900" fill="#2563eb" opacity="0.12">1BSY</text>

  <!-- Calyx Beta-Barrel Ribbon -->
  <path d="M 60,60 C 100,120 150,140 210,80 C 270,20 320,60 360,130" 
        stroke="url(#wheyRibbon)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 90,140 C 140,40 220,50 270,120 C 310,170 340,110 370,60" 
        stroke="url(#cyanRibbon)" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 2" fill="none" opacity="0.7"/>

  <circle cx="210" cy="80" r="8" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="270" cy="120" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="120" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>

  <g transform="translate(20, 20)">
    <rect width="135" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="14" y="19" font-size="14">🥛</text>
    <text x="36" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Whey Susu</text>
  </g>
</svg>
