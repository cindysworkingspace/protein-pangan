<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="helixGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="helixGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Glow & Ring -->
  <rect width="48" height="48" rx="12" fill="url(#glowGrad)"/>
  <rect width="46" height="46" x="1" y="1" rx="11" stroke="url(#helixGrad1)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Molecular Bond Connectors (Peptide backbone rungs) -->
  <g stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
    <line x1="16" y1="14" x2="32" y2="18"/>
    <line x1="14" y1="24" x2="34" y2="24"/>
    <line x1="16" y1="34" x2="32" y2="30"/>
  </g>

  <!-- Strand 1 (Alpha Helix primary twist) -->
  <path d="M 16,10 C 26,14 36,18 34,25 C 32,32 14,32 14,39 C 14,41 16,42 20,42" 
        stroke="url(#helixGrad1)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glowFilter)"/>

  <!-- Strand 2 (Complementary Twist) -->
  <path d="M 32,8 C 22,12 12,18 14,24 C 16,30 34,31 32,38 C 30,41 24,42 22,42" 
        stroke="url(#helixGrad2)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.5 0" fill="none"/>

  <!-- Amino Acid Nodes / Atoms -->
  <circle cx="16" cy="10" r="3" fill="#2dd4bf" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="34" cy="18" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="14" cy="24" r="3.2" fill="#0d9488" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="34" cy="24" r="2.8" fill="#6366f1" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="14" cy="34" r="3" fill="#818cf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="38" r="3.2" fill="#4f46e5" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Core Active Center Particle -->
  <circle cx="24" cy="24" r="2" fill="#fbbf24"/>
</svg>
